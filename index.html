<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenta Check</title>
    <link rel="stylesheet" href="./public/tw-fallback.css">
    <script>
        if (!navigator.onLine) {
            document.documentElement.className += ' offline-mode';
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b5cf6" />
    <link rel="icon" type="image/png" href="./public/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

</head>

<body class="bg-white overflow-x-hidden">
    <!-- PWA Install Toast -->
    <div id="pwaToast" class="pwa-toast">
        <span>Install this app for offline access</span>
        <button id="installPwa">Install</button>
    </div>

    <!-- Splash Screen -->
    <div id="splashScreen" class="splash-phase-1">
        <div id="splashBg"></div>
        <div id="splashContent">
            <img id="splashIcon" src="./public/favicon.png" alt="Authenta">
        </div>
    </div>

    <!-- Main Content (hidden until splash is gone) -->
    <div id="app" class="mx-auto overflow-x-hidden pt-0" style="display:none;">
        <!-- Start Screen -->
        <div id="startScreen" class="text-center">
            <div id="showcaseGrid" class="showcase-grid">
            </div>

            <div class="flex flex-col justify-center items-center gap-5 my-auto min-h-[70vh]">
                <h1 class="text-5xl font-bold text-gray-800 my-6 sm:text-[5rem]">Can you tell AI from Real?</h1>
                <p class="text-xl text-gray-600 mb-8 sm:text-[1.5rem]">Classify the images as Real or AI-generated.</p>

                <button id="startBtn"
                    class="gradient-glow-btn text-white font-bold py-3 px-8 rounded-full text-xl">
                    Start Now <span class="arrow-animate">→</span>
                </button>
            </div>
        </div>

        <div id="gameScreen" class="hidden flex flex-col justify-center items-center min-h-screen">
            <!-- Home Button -->
            <button id="homeIconBtn"
                class="fixed top-4 left-4 z-50 bg-white hover:bg-gray-100 text-gray-700 hover:text-purple-600 p-2 rounded-full shadow-lg w-10 h-10  transition-all duration-300 border border-gray-200">
                <i class="fas fa-home"></i>
            </button>

            <div class="w-full max-w-4xl mx-auto">
                <div class="mb-4 flex flex-col items-center">
                    <div class="bg-gray-200 rounded-full h-2 mb-2 w-full max-w-md">
                        <div id="progressBar" class="bg-purple-700 h-2 rounded-full transition-all duration-300"
                            style="width: 0%"></div>
                    </div>
                    <p class="text-gray-800 text-center">
                        <span id="currentImage">1</span> / <span id="totalImages">10</span>
                    </p>
                </div>

                <div class="flex justify-center">
                    <div class="flex flex-col md:flex-row gap-8 items-center">
                        <div class="relative flex justify-center items-center w-full max-w-sm mx-auto">
                            <div id="imageContainer" class="flex items-center justify-center">
                            </div>
                            <div id="feedbackIndicator"
                                class="absolute inset-0 flex flex-col items-center justify-center text-white text-4xl font-bold rounded-lg hidden">
                                <i id="feedbackIcon" class="text-6xl mb-2"></i>
                                <span id="feedbackText"></span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-col items-center justify-center space-y-2">
                            <button id="realBtn"
                                class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-8 rounded-full text-2xl transition-colors w-48">
                                REAL
                            </button>
                            <button id="aiBtn"
                                class="bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-8 rounded-full text-2xl transition-colors w-48">
                                AI
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- End Screen -->
    <div id="endScreen" class="hidden text-center">
        <h2 class="text-4xl font-bold text-gray-800 mb-6">Game Complete!</h2>
        <div class="bg-gray-100 bg-opacity-80 rounded-3xl p-8 mb-6 max-w-lg mx-auto border border-gray-200">
            <div class="flex justify-around items-center">
                <!-- Authenta's Score Column -->
                <div class="text-center px-4">
                    <h3 class="text-2xl font-semibold text-gray-700 mb-2">Authenta's Accuracy</h3>
                    <div class="text-6xl font-bold text-purple-600">92%</div>
                </div>

                <!-- Divider -->
                <div class="w-px h-24 bg-gray-300"></div>

                <!-- Your Score Column -->
                <div class="text-center px-4">
                    <h3 class="text-2xl font-semibold text-gray-700 mb-2">Your Score</h3>
                    <div class="text-6xl font-bold text-gray-800" id="scorePercentage">0%</div>
                    <div class="text-lg text-gray-500 mt-2" id="finalScore">0/10</div>
                </div>
            </div>
        </div>
        <div class="flex justify-center items-center space-x-4 mt-8">
            <button id="playAgainBtn"
                class="gradient-glow-btn bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-full border-2 border-purple-300 border-opacity-50 hover:border-opacity-75 text-xl transition-colors">
                Play Again
            </button>
            <button id="homeBtn"
                class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-full border-2 border-gray-400 text-xl transition-colors">
                Go to Home
            </button>
        </div>
    </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const splashScreen = document.getElementById('splashScreen');
            const app = document.getElementById('app');

            setTimeout(() => {
                splashScreen.classList.remove('splash-phase-1');
                splashScreen.classList.add('splash-phase-2');
            }, 2000);

            setTimeout(() => {
                splashScreen.classList.add('splash-fade-out');
            }, 3000);

            setTimeout(() => {
                splashScreen.style.display = 'none';
                if (app) app.style.display = '';
            }, 3500);
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                    })
                    .catch((error) => {
                    });
            });
        }

        // PWA Install Toast - Show only after images are cached
        let deferredPrompt;
        let imagesReady = false;
        const pwaToast = document.getElementById('pwaToast');
        const installBtn = document.getElementById('installPwa');

        console.log('🎯 PWA Install: Initializing...');

        // Check if images are already cached
        async function checkIfImagesAreCached() {
            if ('caches' in window) {
                try {
                    const cacheNames = await caches.keys();
                    console.log('📂 PWA Install: Available caches:', cacheNames);
                    
                    // Try to find the latest cache
                    const targetCache = cacheNames.find(name => name.startsWith('authenta-check'));
                    if (!targetCache) {
                        console.log('ℹ️ PWA Install: No authenta-check cache found yet');
                        return false;
                    }
                    
                    const cache = await caches.open(targetCache);
                    const keys = await cache.keys();
                    const imageCount = keys.filter(req => 
                        req.url.includes('/set-1/') || 
                        req.url.includes('/set-2/') || 
                        req.url.includes('/showcase/')
                    ).length;
                    
                    console.log(`📦 PWA Install: Found ${imageCount} cached images in ${targetCache}`);
                    
                    if (imageCount > 50) { // If more than 50 images cached, consider it ready
                        console.log(`✅ PWA Install: Cache ready with ${imageCount} images`);
                        imagesReady = true;
                        return true;
                    }
                } catch (error) {
                    console.log('ℹ️ PWA Install: Could not check cache:', error);
                }
            }
            return false;
        }

        // Check cache status on load
        checkIfImagesAreCached().then(ready => {
            if (ready && deferredPrompt && pwaToast) {
                console.log('🎉 PWA Install: Showing toast (cache check passed)');
                pwaToast.classList.add('show');
            }
        });

        // Poll for cache readiness every 2 seconds if not ready yet
        const cacheCheckInterval = setInterval(async () => {
            if (!imagesReady) {
                console.log('🔍 PWA Install: Polling cache status...');
                const ready = await checkIfImagesAreCached();
                if (ready && deferredPrompt && pwaToast) {
                    console.log('🎉 PWA Install: Showing toast (polling detected ready)');
                    pwaToast.classList.add('show');
                    clearInterval(cacheCheckInterval);
                }
            } else {
                clearInterval(cacheCheckInterval);
            }
        }, 2000);

        // Listen for service worker messages
        if ('serviceWorker' in navigator) {
            console.log('✅ PWA Install: Service Worker supported');
            
            navigator.serviceWorker.addEventListener('message', (event) => {
                console.log('📨 PWA Install: Received message from SW:', event.data);
                if (event.data && event.data.type === 'IMAGES_CACHED') {
                    console.log(`📦 PWA Install: Images cached (${event.data.count}/${event.data.total})`);
                    imagesReady = true;
                    clearInterval(cacheCheckInterval);
                    // If we already have the install prompt, show the toast now
                    if (deferredPrompt && pwaToast) {
                        console.log('🎉 PWA Install: Showing toast (images ready + prompt available)');
                        pwaToast.classList.add('show');
                    } else {
                        console.log('⏳ PWA Install: Images ready, waiting for install prompt...');
                    }
                }
            });
            
            // Also listen on the controller for messages
            navigator.serviceWorker.ready.then(registration => {
                console.log('✅ PWA Install: Service Worker is ready');
            });
        } else {
            console.log('❌ PWA Install: Service Worker not supported');
        }

        window.addEventListener('beforeinstallprompt', async (e) => {
            console.log('🔔 PWA Install: beforeinstallprompt event fired');
            // Prevent the default browser install prompt
            e.preventDefault();
            // Store the event for later use
            deferredPrompt = e;
            
            // Check cache if not already ready
            if (!imagesReady) {
                console.log('🔍 PWA Install: Checking cache status on prompt...');
                await checkIfImagesAreCached();
            }
            
            // Only show toast if images are ready
            if (imagesReady && pwaToast) {
                console.log('🎉 PWA Install: Showing toast (prompt + images ready)');
                pwaToast.classList.add('show');
            } else {
                console.log(`⏳ PWA Install: Prompt available, waiting for images... (imagesReady: ${imagesReady})`);
            }
        });

        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                console.log('👆 PWA Install: Install button clicked');
                if (!deferredPrompt) {
                    console.log('❌ PWA Install: No deferred prompt available');
                    return;
                }
                
                console.log('📱 PWA Install: Showing browser install prompt...');
                // Show the browser's install prompt
                deferredPrompt.prompt();
                
                // Wait for the user's response
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`✅ PWA Install: User choice - ${outcome}`);
                
                // Hide toast after user responds (accepted or dismissed)
                if (pwaToast) {
                    pwaToast.classList.remove('show');
                    console.log('👋 PWA Install: Toast hidden');
                }
                
                // Clear the deferred prompt
                deferredPrompt = null;
            });
        }

        // Hide toast when app is successfully installed
        window.addEventListener('appinstalled', () => {
            console.log('🎊 PWA Install: App successfully installed!');
            if (pwaToast) {
                pwaToast.classList.remove('show');
            }
        });

    </script>
</body>

</html>
